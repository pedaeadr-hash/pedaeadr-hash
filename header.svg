<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Adrian Ariel — desenvolvedor C#, React e SQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset=".55" stop-color="#0d1422"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eclipse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ac5ff"/>
      <stop offset=".48" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      .fg{fill:#f0f6fc}
      .muted{fill:#9daabe}
      .accent{fill:#83b7ff}
      .mono{font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
      .name{font:700 58px "Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:-2px}
      .role{font:400 17px ui-monospace,SFMono-Regular,Consolas,monospace}
      .intro{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s forwards}
      .title{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) .45s forwards}
      .roles{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .8s forwards}
      .r{opacity:0;animation:rotate 16s ease-in-out infinite}
      .r1{animation-delay:1s}.r2{animation-delay:5s}.r3{animation-delay:9s}.r4{animation-delay:13s}
      .orbit{fill:none;stroke:#719eff;stroke-opacity:.3;stroke-width:1.2;transform-origin:965px 165px;animation:orbit 22s linear infinite}
      .orbit2{fill:none;stroke:#b57aff;stroke-opacity:.24;stroke-width:1;transform-origin:965px 165px;animation:orbit 32s linear infinite reverse}
      .ray{stroke:url(#eclipse);stroke-width:2;stroke-linecap:round;stroke-dasharray:12 18;animation:travel 3.4s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .spark{transform-box:fill-box;transform-origin:center;animation:spark 2.8s ease-in-out infinite}
      .s2{animation-delay:.8s}.s3{animation-delay:1.5s}.s4{animation-delay:2s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes rotate{0%,4%{opacity:0;transform:translateY(7px)}8%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-7px)}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes travel{to{stroke-dashoffset:-60}}
      @keyframes pulse{50%{opacity:.48;transform:scale(1.05)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes spark{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}.r2,.r3,.r4{display:none}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#27364d"/>
  <ellipse cx="965" cy="165" rx="210" ry="130" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
  <circle cx="965" cy="165" r="92" class="orbit"/>
  <ellipse cx="965" cy="165" rx="132" ry="58" class="orbit2"/>
  <circle cx="965" cy="165" r="57" fill="url(#eclipse)" opacity=".17" filter="url(#blur)"/>
  <circle cx="965" cy="165" r="44" fill="#0a1020" stroke="url(#eclipse)" stroke-width="2"/>
  <circle cx="977" cy="151" r="36" fill="url(#eclipse)" opacity=".9"/>
  <circle cx="958" cy="177" r="39" fill="#0b1220"/>
  <path d="M884 165h162" class="ray"/>
  <circle cx="874" cy="139" r="2" fill="#9ac5ff" class="spark"/>
  <circle cx="1061" cy="190" r="2.3" fill="#c5a0ff" class="spark s2"/>
  <circle cx="1025" cy="93" r="1.8" fill="#fff" class="spark s3"/>
  <circle cx="908" cy="235" r="1.8" fill="#fff" class="spark s4"/>
  <text x="82" y="82" class="mono intro"><tspan fill="#72819a">~/adrian-ariel</tspan><tspan class="accent"> $ whoami</tspan><tspan class="accent cursor">_</tspan></text>
  <text x="80" y="158" class="name fg title">Adrian Ariel</text>
  <g class="roles">
    <text x="84" y="205" class="role r r1"><tspan class="accent">&gt; </tspan><tspan class="muted">Back-end com C# e ASP.NET Core</tspan></text>
    <text x="84" y="205" class="role r r2"><tspan class="accent">&gt; </tspan><tspan class="muted">Front-end com React e JavaScript</tspan></text>
    <text x="84" y="205" class="role r r3"><tspan class="accent">&gt; </tspan><tspan class="muted">SQL, consultas e modelagem de dados</tspan></text>
    <text x="84" y="205" class="role r r4"><tspan class="accent">&gt; </tspan><tspan class="muted">Construindo ideias em projetos reais</tspan></text>
  </g>
  <line x1="82" y1="254" x2="1118" y2="254" stroke="#26354b"/>
  <line x1="82" y1="254" x2="1118" y2="254" stroke="url(#eclipse)" stroke-width="2" stroke-linecap="round" stroke-dasharray="82 954" class="ray"/>
  <text x="82" y="287" class="mono" fill="#74839a">C# <tspan fill="#384861">/</tspan> REACT <tspan fill="#384861">/</tspan> SQL</text>
  <text x="1118" y="287" class="mono" text-anchor="end" fill="#74839a">IDEA → CODE → LEARN</text>
</svg>