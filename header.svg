<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Adrian Ariel — C#, React, SQL e chuva de código Matrix">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b08"/><stop offset=".56" stop-color="#09130e"/><stop offset="1" stop-color="#0b1810"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35ff8b" stop-opacity=".08"/><stop offset=".52" stop-color="#35ff8b" stop-opacity=".48"/><stop offset="1" stop-color="#9bffbd" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#baffd2" stop-opacity=".95"/><stop offset=".25" stop-color="#51ff91" stop-opacity=".82"/><stop offset="1" stop-color="#16b95d" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="haze"><stop offset="0" stop-color="#19d765" stop-opacity=".12"/><stop offset="1" stop-color="#19d765" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9cffbd" stroke-opacity=".028"/></pattern>
    <clipPath id="rainWindow"><rect x="700" y="24" width="450" height="220" rx="8"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .title{font:700 52px "Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:-1.8px;fill:#effff4}
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#83a992}
      .stack{font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;fill:#b5d2bd}
      .accent{fill:#5aff91}
      .code{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:url(#rain);opacity:.56}
      .lead{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d7ffe3;filter:url(#glow)}
      .fall{animation:fall 5s linear infinite}
      .f0{animation-duration:3.5s}.f1{animation-duration:4.1s}.f2{animation-duration:4.7s}
      .f3{animation-duration:5.3s}.f4{animation-duration:5.9s}.f5{animation-duration:6.5s}
      .beam{animation:beam 5s ease-in-out infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .star{animation:twinkle 2.4s ease-in-out infinite}
      .delay1{animation-delay:1s}.delay2{animation-delay:1.7s}.delay3{animation-delay:2.2s}
      .reveal{opacity:0;animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
      .reveal2{opacity:0;animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) .48s forwards}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes fall{from{transform:translateY(-250px)}to{transform:translateY(250px)}}
      @keyframes beam{0%,100%{opacity:.1;transform:translateY(0)}50%{opacity:.65;transform:translateY(170px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
      @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="url(#edge)"/>
  <path d="M54 246H1146" stroke="#203c2b"/><path d="M54 246H342" stroke="#42ff84" stroke-width="1.5" opacity=".8"/>
  <circle cx="342" cy="246" r="2.5" fill="#baffd2" class="star delay1"/>
  <g class="reveal">
    <text x="66" y="80" class="eyebrow">ADRIAN ARIEL <tspan fill="#456550">/</tspan> SOFTWARE DEVELOPER</text>
    <text x="62" y="151" class="title">Building with purpose<tspan class="accent">.</tspan></text>
  </g>
  <g class="reveal2">
    <circle cx="69" cy="200" r="3" fill="#5aff91" class="pulse"/>
