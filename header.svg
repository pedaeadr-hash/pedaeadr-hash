
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Adrian Ariel - Desenvolvedor de Software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fg    { fill: #e6edf3; }
    .muted { fill: #7d8590; }
    .acc   { fill: #58a6ff; }
    .track { stroke: #30363d; }
    .seg   { stroke: #58a6ff; }

    @media (prefers-color-scheme: light) {
      .fg    { fill: #1f2328; }
      .muted { fill: #656d76; }
      .acc   { fill: #0969da; }
      .track { stroke: #d0d7de; }
      .seg   { stroke: #0969da; }
    }

    .mono { font: 400 15px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .name { font: 700 56px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role { font: 400 17px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }

    .in { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .35s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .r { opacity: 0; animation: rot 12s ease-in-out infinite; }
    .r1 { animation-delay: 1s; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 7s; }
    .r4 { animation-delay: 10s; }
    @keyframes rot {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    .track { stroke-width: 1.5; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1.2s .7s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .seg { stroke-width: 2; stroke-linecap: round; opacity: 0; animation: slide 4.5s 1.9s ease-in-out infinite alternate; }
    @keyframes slide {
      0%   { opacity: 1; transform: translateX(0); }
      100% { opacity: 1; transform: translateX(200px); }
    }

    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .in, .r1 { opacity: 1; animation: none; }
      .r2, .r3, .r4 { display: none; }
      .track { stroke-dashoffset: 0; animation: none; }
      .seg, .blink { animation: none; }
    }
  </style>

  <text class="mono in d1" x="450" y="50" text-anchor="middle">
    <tspan class="muted">~/adrian-ariel</tspan><tspan class="acc"> $ whoami</tspan><tspan class="acc blink">_</tspan>
  </text>

  <text class="name fg in d2" x="450" y="118" text-anchor="middle">Adrian Ariel</text>

  <text class="role r r1" x="450" y="160" text-anchor="middle"><tspan class="acc">&gt; </tspan><tspan class="muted">APIs REST com C# e ASP.NET Core</tspan></text>
  <text class="role r r2" x="450" y="160" text-anchor="middle"><tspan class="acc">&gt; </tspan><tspan class="muted">Interfaces modernas com React</tspan></text>
  <text class="role r r3" x="450" y="160" text-anchor="middle"><tspan class="acc">&gt; </tspan><tspan class="muted">Front + API no mesmo deploy via wwwroot</tspan></text>
  <text class="role r r4" x="450" y="160" text-anchor="middle"><tspan class="acc">&gt; </tspan><tspan class="muted">Estudante de Análise e Desenvolvimento de Sistemas</tspan></text>

  <line class="track" x1="330" y1="198" x2="570" y2="198" fill="none"/>
  <line class="seg" x1="330" y1="198" x2="370" y2="198" fill="none"/>
</svg>
