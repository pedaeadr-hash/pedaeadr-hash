<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Adrian Ariel — C#, React e SQL">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d17"/>
      <stop offset=".55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a5ff" stop-opacity=".08"/>
      <stop offset=".52" stop-color="#62a5ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#bd8cff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e8ff"/>
      <stop offset=".42" stop-color="#6aa9ff"/>
      <stop offset=".74" stop-color="#9a7bff"/>
      <stop offset="1" stop-color="#d9e8ff"/>
    </linearGradient>
    <radialGradient id="corona">
      <stop offset=".48" stop-color="#4b83d9" stop-opacity=".03"/>
      <stop offset=".72" stop-color="#6daaff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6daaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".34" cy=".3">
      <stop offset="0" stop-color="#182740"/>
      <stop offset=".7" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#050911"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b5c9e8" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .title{font:700 52px "Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:-1.8px;fill:#f3f7ff}
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#8ba1bd}
      .stack{font:500 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px;fill:#a8bad2}
      .accent{fill:#7db5ff}
      .ringA{fill:none;stroke:url(#ring);stroke-width:1.5;stroke-dasharray:72 20 12 26;transform-origin:950px 150px;animation:orbit 18s linear infinite}
      .ringB{fill:none;stroke:#8dbbff;stroke-opacity:.28;stroke-width:1;stroke-dasharray:2 8;transform-origin:950px 150px;animation:orbit 28s linear infinite reverse}
      .beam{stroke:url(#ring);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:14 180;animation:scan 4.5s ease-in-out infinite}
      .glow{animation:breathe 4.8s ease-in-out infinite}
      .star{animation:twinkle 3s ease-in-out infinite}
      .delay1{animation-delay:1s}.delay2{animation-delay:1.8s}.delay3{animation-delay:2.4s}
      .reveal{opacity:0;animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
      .reveal2{opacity:0;animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) .48s forwards}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes scan{0%,100%{stroke-dashoffset:170;opacity:.15}50%{stroke-dashoffset:-35;opacity:.8}}
      @keyframes breathe{0%,100%{opacity:.58;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
      @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="url(#edge)"/>
  <path d="M54 246H1146" stroke="#26354a" stroke-width="1"/>
  <path d="M54 246H342" stroke="url(#ring)" stroke-width="1.5" opacity=".8"/>
  <circle cx="342" cy="246" r="2.5" fill="#9ac5ff" class="star delay1"/>

  <g class="reveal">
    <text x="66" y="80" class="eyebrow">ADRIAN ARIEL <tspan fill="#40536e">/</tspan> SOFTWARE DEVELOPER</text>
    <text x="62" y="151" class="title">Building with purpose<tspan class="accent">.</tspan></text>
  </g>
  <g class="reveal2">
    <circle cx="69" cy="200" r="3" fill="#76b1ff"/>
    <text x="83" y="205" class="stack">C# <tspan fill="#526783">/</tspan> REACT <tspan fill="#526783">/</tspan> SQL</text>
    <text x="66" y="274" class="eyebrow" letter-spacing="2">BACK-END · FRONT-END · DATA</text>
    <text x="480" y="274" class="eyebrow" letter-spacing="2">IDEAS INTO SOFTWARE</text>
  </g>

  <circle cx="950" cy="150" r="112" fill="url(#corona)" class="glow"/>
  <circle cx="950" cy="150" r="83" class="ringB"/>
  <ellipse cx="950" cy="150" rx="100" ry="39" class="ringA"/>
  <ellipse cx="950" cy="150" rx="100" ry="39" class="ringA" transform="rotate(62 950 150)" opacity=".6"/>
  <circle cx="950" cy="150" r="48" fill="url(#planet)" stroke="#9fc5ff" stroke-opacity=".48"/>
  <circle cx="950" cy="150" r="53" fill="none" stroke="#91bdff" stroke-opacity=".28" class="glow"/>
  <path d="M890 150H1010" class="beam"/>
  <circle cx="876" cy="107" r="2" fill="#e1edff" class="star"/>
  <circle cx="1030" cy="196" r="2.5" fill="#a889ff" class="star delay1"/>
  <circle cx="1006" cy="73" r="1.8" fill="#dce9ff" class="star delay2"/>
  <circle cx="883" cy="214" r="1.7" fill="#9bc4ff" class="star delay3"/>
  <circle cx="1060" cy="127" r="1.5" fill="#dce9ff" class="star delay2"/>
</svg>